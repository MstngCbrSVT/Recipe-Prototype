name: Deploy web preview to GitHub Pages

# Builds the Expo web version and publishes it to GitHub Pages so the app can be
# opened as a link in any phone browser — no computer or Expo Go required.

on:
  push:
    branches: [claude/meal-planning-app-features-o9hpdc]
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web build
        run: npx expo export --platform web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Enable & configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # GitHub Pages publishing occasionally returns a transient
      # "Deployment failed, try again later" — so try once, then auto-retry.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
